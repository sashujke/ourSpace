<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Head Ball 2 - Fase 1</title>
    <style>
        :root {
            --sfondo: #0f1b2d;
            --testo: #f6f9ff;
            --cornice-canvas: #f4f8ff;
            --ombra-canvas: rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            background: radial-gradient(circle at 20% 10%, #1e3f66 0%, var(--sfondo) 55%);
            color: var(--testo);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            padding: 16px;
        }

        h1 {
            margin: 0;
            font-size: clamp(20px, 2.2vw, 30px);
            letter-spacing: 0.6px;
        }

        p {
            margin: 0;
            font-size: clamp(14px, 1.4vw, 18px);
            opacity: 0.95;
            text-align: center;
        }

        #campo-gioco {
            width: min(96vw, 1000px);
            height: auto;
            border: 4px solid var(--cornice-canvas);
            box-shadow: 0 16px 40px var(--ombra-canvas);
            background-color: #87c8f7;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Sasha Play</h1>
    <canvas id="campo-gioco" width="1000" height="500"></canvas>

    <script src="./dist/main.js"></script>
</body>
</html>
